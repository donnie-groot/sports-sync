name: sync sports
on:
    schedule:
        - cron: "0 8 * * *"
    workflow_dispatch:
jobs:
    run:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-python@v6
              with:
                  python-version-file: ".python-version"
            - run: pip install -r requirements.txt
            - name: write token file
              run: |
                  mkdir -p config
                  echo '${{ secrets.GOOGLE_TOKEN }}' > config/token.json
            - name: write env file
              run: |
                  echo "cfb_api_key=${{ secrets.CFB_API_KEY }}" > .env
                  echo "cbb_api_key=${{ secrets.CFB_API_KEY }}" >> .env
            - run: python src/main.py